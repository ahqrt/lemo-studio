<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>影片目录 · 视频工坊</title>
<style>
  :root {
    --paper: #f6f1e7;
    --paper-2: #efe7d8;
    --ink: #1b1a17;
    --ink-2: #3c3934;
    --ink-3: #6f6a62;
    --ink-4: #9a9388;
    --rule: rgba(27, 26, 23, 0.16);
    --rule-2: rgba(27, 26, 23, 0.38);
    --red: #c8402c;
    --serif: "Songti SC", "STSong", "SimSun", "Noto Serif CJK SC", serif;
    --sans: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
    --mono: "SF Mono", "Menlo", "ui-monospace", monospace;
    --rail: 156px;
    --pad: 36px;
    --chapters: 172px;
    --agent: 304px;
    --gap: 48px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    font-weight: 400;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  button, input, textarea { font: inherit; color: inherit; border-radius: 0; }
  button { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
  img { display: block; }
  h1, h2, h3, p, figure, dl, dd, ul, ol { margin: 0; padding: 0; }
  ul, ol { list-style: none; }
  ::selection { background: var(--red); color: var(--paper); }
  :focus-visible { outline: 1px solid var(--red); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .view { display: none; height: 100%; }
  #view-gallery.on { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); }
  #view-new.on { display: grid; grid-template-rows: 44px minmax(0, 1fr); }
  #view-desk.on { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }

  .mark {
    display: inline-block;
    width: 8px;
    height: 8px;
    background: var(--red);
    margin-right: 8px;
    vertical-align: 1px;
    flex: none;
  }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .kicker {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--ink-3);
  }

  /* —— gallery rail —— */
  .rail {
    background: var(--paper-2);
    border-right: 1px solid var(--rule);
    display: flex;
    flex-direction: column;
    min-height: 0;
    min-width: 0;
  }
  .rail-head { padding: 22px 14px 12px; border-bottom: 1px solid var(--rule); }
  .rail-head .brand {
    display: flex;
    align-items: center;
    font-size: 12px;
    margin-bottom: 10px;
  }
  .rail-head strong {
    display: block;
    font-family: var(--serif);
    font-weight: 400;
    font-size: 22px;
    letter-spacing: 0.06em;
  }
  .tabs { flex: 1; overflow: auto; padding: 8px 0; }
  .tab {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 6px;
    width: 100%;
    padding: 7px 12px;
    border-left: 2px solid transparent;
    font-size: 13px;
    color: var(--ink-2);
  }
  .tab .n { font-family: var(--mono); font-size: 11px; color: var(--ink-4); }
  .tab:hover { color: var(--ink); }
  .tab[aria-current="true"] {
    background: var(--paper);
    color: var(--ink);
    border-left-color: var(--ink);
    margin-right: -1px;
  }
  .rail-foot {
    padding: 12px 14px 16px;
    border-top: 1px solid var(--rule);
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    color: var(--ink-3);
    line-height: 1.6;
  }

  .catalog-main {
    height: 100%;
    overflow: auto;
    padding: 0 0 72px;
    min-width: 0;
  }
  .mast { padding: 28px var(--pad) 0; }
  .call, #gallery-root, .colophon { padding-left: var(--pad); padding-right: var(--pad); }
  .mast-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
  }
  .brand { display: flex; align-items: center; font-size: 13px; }
  .lib {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--ink-2);
    white-space: nowrap;
  }
  .mast-title {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 56px;
    line-height: 1;
    letter-spacing: 0.04em;
    margin: 14px 0 10px;
  }
  .mast-sub { color: var(--ink-2); font-size: 14px; margin-bottom: 18px; }
  .rule-ink { border: 0; border-top: 1px solid var(--ink); margin: 0 0 16px; }

  .call h2 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 18px;
    margin: 16px 0 8px;
  }
  .call-cols, .call-row {
    display: grid;
    grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr) 64px minmax(120px, 1.15fr) 36px;
    gap: 12px;
    align-items: baseline;
  }
  .call-cols {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--ink-4);
    padding-bottom: 4px;
  }
  .call-row {
    width: 100%;
    padding: 8px 0;
    border-top: 1px solid var(--rule);
    font-size: 14px;
  }
  .call-row:hover { background: var(--paper-2); }
  .call-row .ttl { font-family: var(--serif); font-size: 16px; }
  .call-row .dur { font-family: var(--mono); font-size: 12px; white-space: nowrap; }
  .call-row .st.bad { color: var(--red); }
  .call-row .go {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--ink-3);
    text-align: right;
  }
  .call-row:hover .go { color: var(--ink); }

  .tools {
    position: sticky;
    top: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 18px;
    margin: 18px 0 22px;
    padding: 10px var(--pad);
    background: var(--paper);
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
  }
  .search-k {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--ink-3);
    flex: none;
  }
  .search {
    -webkit-appearance: none;
    appearance: none;
    flex: 1;
    width: 100%;
    min-width: 0;
    border: 0;
    border-bottom: 1px solid var(--ink);
    background: transparent;
    font-family: var(--serif);
    font-size: 16px;
    padding: 4px 0;
    outline: none;
  }
  .search:focus { border-bottom-color: var(--ink); border-bottom-width: 1px; }
  .search::placeholder { color: var(--ink-4); font-family: var(--sans); font-size: 13px; }
  .search::-webkit-search-decoration,
  .search::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
  .count, .folio {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--ink-3);
    white-space: nowrap;
  }
  .folio { color: var(--ink); }
  .clear-q {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    border-bottom: 1px solid var(--ink);
  }

  .chapter-head {
    display: flex;
    align-items: baseline;
    gap: 14px;
    border-top: 1px solid var(--ink);
    padding-top: 12px;
    margin: 4px 0 22px;
  }
  .chapter-head h2 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 28px;
  }
  .chapter-head .en {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--ink-3);
  }
  .chapter-head .count {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-3);
  }

  .plates {
    display: grid;
    grid-template-columns: 1fr 1fr;
    column-gap: var(--gap);
    row-gap: 42px;
    position: relative;
  }
  .plates::before {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: 50%;
    width: 1px;
    background: var(--rule-2);
    transform: translateX(-0.5px);
    pointer-events: none;
  }
  .plate {
    display: block;
    width: 100%;
    color: inherit;
    animation: rise 480ms ease both;
  }
  .plate:nth-child(2) { animation-delay: 40ms; }
  .plate:nth-child(3) { animation-delay: 80ms; }
  .plate:nth-child(4) { animation-delay: 120ms; }
  .plate:nth-child(5) { animation-delay: 160ms; }
  .plate:nth-child(6) { animation-delay: 200ms; }
  .plate-img {
    position: relative;
    overflow: hidden;
    background: var(--ink);
    aspect-ratio: 16 / 9;
  }
  .plate-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 520ms ease;
  }
  .plate-img::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 48%, rgba(27, 26, 23, 0.5) 100%);
    opacity: 0;
    transition: opacity 420ms ease;
    pointer-events: none;
  }
  .hover-meta {
    position: absolute;
    left: 12px;
    right: 12px;
    bottom: 10px;
    z-index: 1;
    color: var(--paper);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.04em;
    line-height: 1.4;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 420ms ease, transform 420ms ease;
    pointer-events: none;
  }
  .plate:hover img, .plate:focus-visible img { transform: scale(1.035); }
  .plate:hover .plate-img::after, .plate:focus-visible .plate-img::after { opacity: 1; }
  .plate:hover .hover-meta, .plate:focus-visible .hover-meta { opacity: 1; transform: none; }
  .plate-cap {
    display: grid;
    grid-template-columns: 36px minmax(0, 1fr);
    column-gap: 10px;
    row-gap: 2px;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--rule-2);
  }
  .plate-num {
    grid-row: 1 / span 4;
    font-family: var(--serif);
    font-size: 20px;
    line-height: 1.15;
  }
  .plate-cn { font-family: var(--serif); font-size: 18px; line-height: 1.25; }
  .plate-en {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-3);
    letter-spacing: 0.02em;
  }
  .plate-line {
    font-size: 13px;
    line-height: 1.5;
    color: var(--ink-2);
    margin-top: 3px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .plate-foot {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    margin-top: 4px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-3);
  }
  .empty {
    padding: 48px 0;
    border-top: 1px solid var(--ink);
  }
  .empty p { font-family: var(--serif); font-size: 22px; margin-bottom: 12px; }
  .colophon {
    margin-top: 48px;
    padding-top: 16px;
    border-top: 1px solid var(--ink);
    text-align: center;
    color: var(--ink-3);
    font-size: 13px;
  }
  .colophon .end {
    font-family: var(--serif);
    font-size: 20px;
    color: var(--ink);
    letter-spacing: 0.4em;
    margin-bottom: 6px;
  }

  /* —— new —— */
  .new-top {
    display: grid;
    grid-template-columns: 120px minmax(0, 1fr) auto;
    gap: 16px;
    align-items: center;
    padding: 0 24px;
    border-bottom: 1px solid var(--ink);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
  }
  .new-top button { letter-spacing: 0.08em; }
  .new-top button:hover { border-bottom: 1px solid var(--ink); }
  #new-crumb { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
  .new-body {
    display: grid;
    grid-template-columns: minmax(0, 1.08fr) minmax(0, 0.92fr);
    min-height: 0;
  }
  .new-hero, .new-form { overflow: auto; min-width: 0; padding: 28px 36px 48px; }
  .new-form { border-left: 1px solid var(--rule-2); }
  .hero-img { background: var(--ink); aspect-ratio: 16 / 9; overflow: hidden; }
  .hero-img img { width: 100%; height: 100%; object-fit: cover; }
  .hero-num {
    margin-top: 12px;
    font-family: var(--serif);
    font-size: 20px;
  }
  .hero-cn {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 36px;
    line-height: 1.15;
    margin: 4px 0 6px;
  }
  .hero-en { font-family: var(--mono); font-size: 12px; color: var(--ink-3); letter-spacing: 0.03em; }
  .hero-line {
    font-family: var(--serif);
    font-size: 16px;
    line-height: 1.55;
    margin: 14px 0 18px;
    max-width: 36em;
  }
  .specs div, .field {
    display: grid;
    grid-template-columns: 72px minmax(0, 1fr);
    gap: 12px;
    align-items: baseline;
    padding: 8px 0;
    border-top: 1px solid var(--rule);
    font-size: 14px;
  }
  .specs dt, .field .label, .specs .label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--ink-3);
  }
  .specs dd { margin: 0; }
  .form-title {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 32px;
    margin-bottom: 6px;
  }
  .form-lead { color: var(--ink-2); margin-bottom: 18px; max-width: 36em; }
  .idea-label {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: baseline;
    margin-bottom: 6px;
  }
  .idea-label { flex-wrap: wrap; }
  .idea-label > span:first-child { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; color: var(--ink-3); }
  .eg { font-family: var(--serif); font-size: 13px; color: var(--ink-4); letter-spacing: 0; }
  .idea {
    width: 100%;
    min-height: 148px;
    border: 1px solid var(--ink);
    border-left-width: 2px;
    background: transparent;
    font-family: var(--serif);
    font-size: 20px;
    line-height: 1.55;
    padding: 12px 14px;
    resize: vertical;
    outline: none;
  }
  .idea:focus { border-left-color: var(--ink); }
  .choice {
    color: var(--ink-3);
    margin-right: 18px;
    padding: 0 0 2px;
    border-bottom: 1px solid transparent;
  }
  .choice[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--ink); }
  .choice:hover { color: var(--ink); }
  .hint { display: block; color: var(--ink-3); font-size: 12px; margin-top: 6px; line-height: 1.5; }
  .form-next { margin-top: 28px; max-width: 28em; color: var(--ink-3); font-size: 13px; line-height: 1.55; }
  .field.stack { align-items: start; }
  .disclose {
    margin: 18px 0 8px;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.06em;
  }
  .disclose::before { content: "+"; margin-right: 8px; }
  .disclose[aria-expanded="true"]::before { content: "−"; }
  .advanced { padding: 0 0 8px 16px; border-left: 1px solid var(--rule); }
  .form-error { color: var(--red); font-family: var(--serif); font-size: 15px; margin-top: 16px; }
  .actions { display: flex; align-items: center; gap: 18px; margin-top: 22px; }
  .btn-ink {
    background: var(--ink);
    color: var(--paper);
    border: 1px solid var(--ink);
    padding: 10px 16px;
    font-family: var(--serif);
    font-size: 16px;
    text-align: center;
  }
  .btn-ink:hover { background: var(--red); border-color: var(--red); }
  .btn-ink:disabled { opacity: 0.45; cursor: default; }
  .btn-ink:disabled:hover { background: var(--ink); border-color: var(--ink); }
  .btn-ghost {
    border: 1px solid var(--ink);
    padding: 9px 14px;
    font-family: var(--serif);
    font-size: 15px;
    text-align: center;
  }
  .btn-ghost:hover { border-color: var(--red); color: var(--red); }
  .btn-text { border-bottom: 1px solid transparent; padding-bottom: 1px; }
  .btn-text:hover { border-bottom-color: var(--ink); }

  /* —— desk —— */
  .desk-head {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 4px 28px;
    align-items: end;
    padding: 14px 24px 12px;
    border-bottom: 1px solid var(--ink);
    min-width: 0;
  }
  .desk-path {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-3);
    letter-spacing: 0.02em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .desk-title {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 32px;
    line-height: 1.15;
    outline: none;
    border-bottom: 1px solid transparent;
    display: inline-block;
    max-width: 100%;
    min-width: 4em;
  }
  .desk-title:focus { border-bottom-color: var(--ink); }
  .desk-meta { color: var(--ink-2); font-size: 13px; margin-top: 4px; }
  .desk-side { text-align: right; }
  .desk-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
  .desk-actions .btn-ghost, .desk-actions .btn-ink { font-size: 14px; padding: 7px 12px; }
  #live {
    min-height: 1.2em;
    margin-top: 6px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.03em;
    color: var(--ink-2);
  }
  #live.hot { color: var(--red); }
  .desk-body {
    display: grid;
    grid-template-columns: var(--chapters) minmax(0, 1fr) var(--agent);
    min-height: 0;
  }
  .desk-body.agent-closed { grid-template-columns: var(--chapters) minmax(0, 1fr) 36px; }
  .chapters {
    background: var(--paper-2);
    border-right: 1px solid var(--rule);
    overflow: auto;
    min-width: 0;
    padding: 12px 0 20px;
  }
  .rail-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.14em;
    color: var(--ink-4);
    padding: 4px 14px 8px;
  }
  .ch {
    display: grid;
    grid-template-columns: 22px minmax(0, 1fr) auto;
    gap: 6px;
    width: 100%;
    padding: 8px 12px;
    border-left: 2px solid transparent;
    font-size: 13px;
    color: var(--ink-2);
  }
  .ch .num { font-family: var(--mono); font-size: 11px; }
  .ch .name { min-width: 0; }
  .ch .ch-mark { font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em; color: var(--ink-4); }
  .ch.future { color: var(--ink-4); }
  .ch[aria-current="true"] {
    background: var(--paper);
    color: var(--ink);
    border-left-color: var(--ink);
    margin-right: -1px;
  }
  .ch.todo { border-left-color: var(--red); }
  .ch.todo .num, .ch.todo .ch-mark { color: var(--red); }
  .ch:hover { color: var(--ink); }
  .work { overflow: auto; min-width: 0; background: var(--paper); }
  .work-inner { animation: rise 280ms ease; }
  .work-head {
    position: sticky;
    top: 0;
    z-index: 2;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    padding: 14px 24px;
    background: var(--paper);
    border-bottom: 1px solid var(--rule);
  }
  .work-head h2 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 22px;
    white-space: nowrap;
  }
  .sn { font-family: var(--mono); font-size: 12px; color: var(--ink-3); margin-right: 8px; }
  .work-note { flex: 1; min-width: 0; font-family: var(--serif); font-size: 14px; color: var(--ink-2); }
  .work-note.bad { color: var(--red); }
  .work-actions { display: flex; gap: 8px; flex: none; }
  .file {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--ink-3);
    white-space: nowrap;
  }
  .work-body { padding: 20px 24px 48px; }
  .manuscript {
    font-family: var(--serif);
    font-size: 22px;
    line-height: 1.55;
    padding-left: 14px;
    border-left: 2px solid var(--ink);
    max-width: 36em;
    margin-bottom: 22px;
  }
  .block-title {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 16px;
    margin: 22px 0 8px;
  }
  .structures li {
    padding: 10px 0 10px 12px;
    border-top: 1px solid var(--rule);
    border-left: 2px solid transparent;
    max-width: 44em;
  }
  .structures li.picked { border-left-color: var(--ink); }
  .structures .k, .structures .tag {
    font-family: var(--mono);
    font-size: 12px;
    margin-right: 8px;
  }
  .structures .tag { color: var(--ink-3); margin-left: 8px; }
  .shots { width: 100%; border-collapse: collapse; font-size: 14px; }
  .shots th {

    items.push(["FRAME " + pad(n), bad.flag === "grey" ? "偏灰 · 待改" : "已重抽 · 待看", true]);

  p.frames.forEach((f, i) => setTimeout(() => {
    if (state.pulling !== p.id) return;
    state.live = "still.mjs · 重抽 " + (i + 1) + "/3 · " + tcStamp(f.t);

    if (state.pulling !== p.id) return;

function startRender(p) {
  if (state.rendering) return;
  state.rendering = { id: p.id, t: 0, phase: "video.mjs" };
  state.liveHot = true;
  paintLive();
  const total = 138;
  const timer = setInterval(() => {
    const r = state.rendering;
    if (!r || r.id !== p.id) { clearInterval(timer); return; }
    r.t += 8;
    if (r.t >= total - 16) r.phase = "mux.sh";
    const shown = Math.min(r.t, total);
    state.live = r.phase + " · " + fmtDur(shown) + " / 02:18";
    state.liveHot = true;
    if (showingDesk(p.id)) paintLive();
    if (r.t >= total) {
      clearInterval(timer);
      setTimeout(() => finishRender(p.id), 420);
    }
  }, 220);
}

  p.versions.unshift({ id: "v" + n, kind: blocked ? "草稿" : "成片", lufs: "−14.1", dur: fmtDur(p.dur), current: true });
  p.renderTime = "2 分 18 秒";

    ? "已写入 v" + n + " 草稿 · 2 分 18 秒 · 还有帧待改，不能交付"
    : "已写入 v" + n + " 成片 · 2 分 18 秒 · −14.1 LUFS";

  if (!p.frames.some((x) => x.flag) && !p.done.includes("frames")) p.done.push("frames");
  addTurn(p, "你", "第 " + (i + 1) + " 帧可以。");
  addTurn(p, "导演", p.frames.some((x) => x.flag) ? "这一帧点头。还有帧没看。" : "三张都过了。可以谈声音，或直接出草稿。");
  renderDesk({ scrollAgent: true });
}
function runQuick(id) {
  const p = current();
  const style = styleOf(p);
  const label = QUICK.find((q) => q[0] === id)[1];
  addTurn(p, "你", label);
  if (id === "treatment") {
    p.stage = "treatment";
    addTurn(p, "导演", "三个结构里我选先给特写的那个。开头三秒不能是空镜。Treatment 在 TREATMENT.md，风格不动。");
  } else if (id === "frames") {
    p.stage = "frames";
    addTurn(p, "导演", "按 " + style.cn + " 的 STYLE.md 抽三张。你先看中段，灰不灰不用等成片。");
    if (!p.frames.length) startExtract(p);
  } else if (id === "grey") {
    askFix();
    return;
  } else if (id === "board") {
    p.stage = "board";
    if (p.skip.includes("board")) p.boardShown = true;
    addTurn(p, "导演", p.board ? "按镜头表接 6 张。你点头我才进声音。" : "简报没要求先看分镜。这张 contact sheet 是补的，不点头就不进声音。");
  } else if (id === "subs") {
    p.stage = "sound";
    addTurn(p, "导演", p.lines ? "6 条都超过 1.8 秒。最短 2.2 秒。没有遮住主体。readcheck 通过。" : "字幕还没写死。等 Treatment 的对白落了再跑 readcheck。");
  } else if (id === "render") {
    const blocked = !p.frames.length || p.frames.some((f) => f.flag);
    addTurn(p, "导演", blocked ? "可以出草稿。有帧没点头的话，这一版不能标交付。" : "画面点过头。出成片，mux 之后看 −14 LUFS。");
    startRender(p);
  }
  renderDesk({ scrollAgent: true });
}
function freeReply(text, p) {
  if (/灰|层次|罩染|留白|海面/.test(text)) return p.id === "tide" ? GREY_REPLY : "灰通常是纸色被罩染吃了。指出第几帧，我降罩染，不动时间轴。";
  if (/开头|三秒|抓人/.test(text)) return p.id === "tide" ? OPEN_REPLY : "开头三秒不要空镜。先给一个看得清的特写，第二秒再交代是谁。改镜头表，不动风格。";
  if (/字幕|停留|遮挡/.test(text)) return "readcheck 的底线是 1.8 秒。你要是觉得赶，指出第几条。";
  if (/交付|能交|可以交/.test(text)) {
    if (p.frames.some((f) => f.flag)) return "还不能交。有一帧没点头，lint 过了也不算。改完再抽，再谈交付。";
    if (!p.versions.some((v) => v.kind === "成片" || v.kind === "交付")) return "画面可以谈，但还没有成片。先渲染，看响度和黑帧。";
    return "可以交。响度、字幕、黑帧都在页脚那一行。";
  }
  if (/配乐|音乐/.test(text)) return "配乐等画面点头再锁。现在铺音乐，画面一改就白铺。";
  if (/配音|人声/.test(text)) return p.voice ? "人声先回读，一句一字。过了再混。" : "这一支不配音。不要临时加人声。";
  return "听到了。指一帧，或一个时间码。我改那一处，不动整支。";
}
function sendAgent() {
  const p = current();
  if (!p) return;
  const text = (state.agentDraft || "").trim();
  if (!text) return;
  state.agentDraft = "";
  addTurn(p, "你", text);
  addTurn(p, "导演", freeReply(text, p));
  if (/灰|层次|海面/.test(text) && p.frames.length) p.stage = "frames";
  renderDesk({ scrollAgent: true });
}

function stopPlay() {
  if (state.playTimer) clearInterval(state.playTimer);
  state.playTimer = null;
  state.playing = false;
}
function playTotal() {
  const p = current();
  if (!p) return 45 * 24;
  const cur = p.versions.find((v) => v.current);
  const dur = cur && cur.dur === "00:41" ? 41 : p.dur;
  return dur * 24;
}
function paintPlay() {
  const tc = document.getElementById("tc");
  const head = document.getElementById("playhead");
  const player = document.querySelector(".player");
  if (!tc || !player || player.classList.contains("empty")) return;
  const total = playTotal();
  tc.textContent = tcFrames(state.playFrame);
  if (head) head.style.width = (100 * state.playFrame / total) + "%";
  player.classList.toggle("playing", state.playing);
}
function togglePlay() {
  const p = current();
  if (!p || !p.versions.length) return;
  if (state.playing) { stopPlay(); paintPlay(); return; }
  state.playing = true;
  const total = playTotal();
  state.playTimer = setInterval(() => {
    state.playFrame += 1;
    if (state.playFrame >= total) { state.playFrame = total; stopPlay(); }
    paintPlay();
  }, 1000 / 24);
  paintPlay();
}
function openOverlay(i) {
  const p = current();
  const f = p.frames[i];
  if (!f) return;
  state.overlay = i;
  const img = document.getElementById("overlay-img");
  img.src = poster(styleOf(p));
  img.style.objectPosition = f.crop;
  img.alt = f.name;
  const flag = f.flag === "grey" ? "待改" : f.flag === "review" ? "待看" : "lint 通过";
  document.getElementById("overlay-cap").innerHTML =
    '<div class="still-meta"><span>' + tcStamp(f.t) + "</span><span>第 " + (i + 1) + " 帧 · " + esc(f.name) + "</span><span class='" + (f.flag ? "flag" : "") + "'>" + flag + "</span></div>" +
    (f.note ? '<p class="anno" style="margin-top:8px"><span class="anno-k">批注</span>' + esc(f.note) + "</p>" : "");
  document.getElementById("overlay").hidden = false;
}
function closeOverlay(silent) {
  state.overlay = null;
  const el = document.getElementById("overlay");
  if (el) el.hidden = true;
  if (!silent) return;
}
function shiftOverlay(dir) {
  const p = current();
  if (!p || state.overlay == null) return;
  const n = p.frames.length;
  if (!n) return;
  openOverlay((state.overlay + dir + n) % n);
}

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;
  if (action === "scrub") {
    const p = current();
    if (!p || !p.versions.length) return;
    const r = el.getBoundingClientRect();
    const ratio = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    state.playFrame = Math.floor(ratio * playTotal());
    paintPlay();
    return;
  }
  if (action === "set-cat") {
    state.cat = el.dataset.cat;
    paintRail();
    renderPlates();
    return;
  }
  if (action === "open-style") {
    state.galleryScroll = document.getElementById("catalog-main").scrollTop;
    go("#/new/" + el.dataset.slug);
    return;
  }
  if (action === "open-project") {
    state.galleryScroll = document.getElementById("catalog-main").scrollTop;
    go("#/desk/" + el.dataset.id);
    return;
  }
  if (action === "clear-search") {
    state.q = "";
    const q = document.getElementById("q");
    if (q) q.value = "";
    renderPlates();
    return;
  }
  if (action === "back") {
    go("#/");
    return;
  }
  if (action === "set-choice") {
    const field = el.dataset.field;
    const value = el.dataset.value;
    if (field === "dur") state.draft.dur = Number(value);
    else if (field === "voice" || field === "board") state.draft[field] = value === "true";
    else state.draft[field] = value;
    state.draft.error = "";
    renderForm();
    return;
  }
  if (action === "toggle-advanced") {
    state.draft.advanced = !state.draft.advanced;
    renderForm();
    return;
  }
  if (action === "create") { createProject(); return; }
  if (action === "set-stage") { setStage(el.dataset.stage); return; }
  if (action === "toggle-agent") {
    state.agentOpen = !state.agentOpen;
    renderAgent(true);
    return;
  }
  if (action === "pull") { startPull(current()); return; }
  if (action === "extract") { startExtract(current()); return; }
  if (action === "ask-fix") { askFix(); return; }
  if (action === "accept-frame") { acceptFrame(Number(el.dataset.index)); return; }
  if (action === "quick") { runQuick(el.dataset.quick); return; }
  if (action === "render") { startRender(current()); return; }
  if (action === "finder") {
    const p = current();
    state.liveHot = false;
    state.live = "Finder · " + filmPath(p);
    paintLive();
    setTimeout(() => {
      if (state.live.startsWith("Finder")) { state.live = ""; paintLive(); }
    }, 2800);
    return;
  }
  if (action === "toggle-play") { togglePlay(); return; }
  if (action === "set-version") {
    const p = current();
    p.versions.forEach((v, i) => { v.current = i === Number(el.dataset.index); });
    stopPlay();
    state.playFrame = 0;
    renderWork();
    return;
  }
  if (action === "open-film") {
    const p = current();
    state.liveHot = false;
    state.live = "已打开 · " + filmPath(p) + "/" + p.title + ".mp4";
    paintLive();
    return;
  }
  if (action === "open-frame") { openOverlay(Number(el.dataset.index)); return; }
  if (action === "close-overlay") { closeOverlay(); return; }
  if (action === "overlay-prev") { shiftOverlay(-1); return; }
  if (action === "overlay-next") { shiftOverlay(1); return; }
  if (action === "show-board") {
    const p = current();
    p.boardShown = true;
    if (p.skip.includes("board")) p.skip = p.skip.filter((s) => s !== "board");
    renderWork();
    renderChapters();
    return;
  }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "q") { state.q = e.target.value; renderPlates(); }
  if (e.target.id === "idea") { state.draft.idea = e.target.value; state.draft.error = ""; }
  if (e.target.id === "agent-input") state.agentDraft = e.target.value;
});
document.addEventListener("submit", (e) => {
  if (e.target.id === "agent-form") { e.preventDefault(); sendAgent(); }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { closeOverlay(); return; }
  if (e.key === "Enter" && e.target.id === "desk-title") { e.preventDefault(); e.target.blur(); }
  if (e.key === "Enter" && e.target.id === "agent-input" && !e.shiftKey) { e.preventDefault(); sendAgent(); }
  if (state.overlay != null && e.key === "ArrowRight") shiftOverlay(1);
  if (state.overlay != null && e.key === "ArrowLeft") shiftOverlay(-1);
});
document.addEventListener("focusout", (e) => {
  if (e.target.id !== "desk-title") return;
  const p = current();
  if (!p) return;
  const t = e.target.textContent.replace(/\s+/g, " ").trim();
  p.title = t ? t.slice(0, 32) : p.title;
  e.target.textContent = p.title;
  const path = document.getElementById("desk-path");
  if (path) path.innerHTML = '<span class="mark" aria-hidden="true"></span>' + esc(filmPath(p));
});
document.getElementById("catalog-main").addEventListener("scroll", updateFolio, { passive: true });
document.addEventListener("error", (e) => {
  if (e.target && e.target.tagName === "IMG") e.target.style.opacity = "0";
}, true);

renderRail();
if (!location.hash) history.replaceState(null, "", "#/");
route();
window.addEventListener("hashchange", route);
  </script>
</body>
