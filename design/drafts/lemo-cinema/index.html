<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>视频工坊 · 画法</title>
<style>
  :root {
    --bg: #0c0b0a;
    --bg-2: #14120f;
    --bg-3: #1c1916;
    --cream: #f2ece1;
    --cream-2: #c9c1b4;
    --mute: #8a8176;
    --line: rgba(242, 236, 225, 0.14);
    --line-2: rgba(242, 236, 225, 0.28);
    --red: #e2452f;
    --serif: "Songti SC", "STSong", "Songti TC", "Noto Serif CJK SC", "Source Han Serif SC", serif;
    --sans: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Source Han Sans SC", sans-serif;
    --mono: "SF Mono", "Menlo", "ui-monospace", monospace;
    --pad: 40px;
    --rail: 152px;
    --dock: 312px;
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; background: var(--bg); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--cream);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    min-width: 1180px;
  }
  body.desk-on { height: 100vh; overflow: hidden; }
  h1, h2, h3, p { margin: 0; }
  button, input, textarea { font: inherit; color: inherit; }
  button {
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
    text-align: left;
  }
  input, textarea {
    background: none;
    border: 0;
    border-radius: 0;
    outline: none;
  }
  img { display: block; max-width: 100%; }
  ::selection { background: var(--red); color: var(--cream); }
  button:focus-visible { outline: 1px solid var(--red); outline-offset: 3px; }
  input:focus-visible, textarea:focus-visible { outline: none; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #3a342c; }
  ::-webkit-scrollbar-track { background: transparent; }

  .kicker, .mono, .num, .dur, .tc, .qc, .readout, .rail-foot, .status-line {
    font-family: var(--mono);
  }

  /* gallery */
  .gallery { padding: 28px var(--pad) 72px; }
  .mast {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 32px;
  }
  .kicker {
    font-size: 11px;
    letter-spacing: 0.16em;
    color: var(--mute);
    margin-bottom: 10px;
  }
  .kicker b { font-weight: 400; color: var(--cream-2); margin-right: 14px; letter-spacing: 0.08em; }
  .mast h1 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 76px;
    line-height: 0.95;
    letter-spacing: 0.04em;
  }
  .mast-side { text-align: right; padding-bottom: 6px; }
  .mast-side .lib {
    font-family: var(--serif);
    font-size: 22px;
    font-weight: 400;
    margin-bottom: 6px;
  }
  .live {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--cream-2);
  }
  .live i {
    width: 6px;
    height: 6px;
    background: var(--red);
    display: block;
  }
  .dek {
    max-width: 28em;
    margin-top: 14px;
    color: var(--cream-2);
    font-size: 14px;
  }

  .now {
    display: grid;
    grid-template-columns: 72px 1fr;
    margin-top: 32px;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .now-label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--mute);
    padding-top: 16px;
  }
  .now-row {
    display: flex;
    align-items: baseline;
    gap: 22px;
    width: 100%;
    padding: 13px 0;
    border-bottom: 1px solid var(--line);
    color: var(--cream);
  }
  .now-row:last-child { border-bottom: 0; }
  .now-row .sq {
    width: 6px;
    height: 6px;
    border: 1px solid var(--mute);
  }
  .now-row.live .sq { background: var(--red); border-color: var(--red); }
  .now-row:hover .sq { background: var(--red); border-color: var(--red); }
  .now-row .title { font-family: var(--serif); font-size: 18px; line-height: 1.3; min-width: 9em; }
  .now-row .st { margin-left: auto; }
  .now-row .sub, .now-row .dur, .now-row .st, .now-row .go {
    font-size: 12px;
    color: var(--mute);
  }
  .now-row .dur, .now-row .st { font-family: var(--mono); }
  .now-row:hover .title { color: var(--cream); }
  .now-row:hover .go { color: var(--cream); }

  .catalog {
    display: grid;
    grid-template-columns: 188px minmax(0, 1fr);
    gap: 40px;
    margin-top: 36px;
    align-items: start;
  }
  .index { position: sticky; top: 20px; max-height: calc(100vh - 40px); overflow: auto; }
  .search { display: flex; flex-direction: column; gap: 4px; margin-bottom: 18px; border-bottom: 1px solid var(--line); }
  .search span {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.16em;
    color: var(--mute);
  }
  .search input {
    font-family: var(--serif);
    font-size: 16px;
    padding: 4px 0 8px;
    width: 100%;
  }
  .search input::placeholder { color: var(--mute); font-family: var(--sans); font-size: 13px; }
  .index button.cat {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    width: 100%;
    gap: 8px;
    border-left: 2px solid transparent;
    padding: 6px 0 6px 10px;
    color: var(--mute);
    font-size: 13px;
  }
  .index button.cat em {
    font-style: normal;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--mute);
  }
  .index button.cat:hover { color: var(--cream-2); }
  .index button.cat.on { color: var(--cream); border-left-color: var(--red); }
  .index button.cat.on em { color: var(--cream-2); }
  .index .rule { height: 1px; background: var(--line); margin: 8px 0 8px 12px; }

  .wall-head {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--mute);
    margin-bottom: 18px;
    display: flex;
    gap: 12px;
    align-items: baseline;
  }
  .wall-head b { font-weight: 400; color: var(--cream); }
  .wall-head button { color: var(--cream-2); border-bottom: 1px solid var(--line-2); font-size: 12px; }
  .wall {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 42px 28px;
    align-content: start;
  }
  .sec-head {
    grid-column: 1 / -1;
    display: flex;
    align-items: baseline;
    gap: 14px;
    margin-top: 8px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--line);
  }
  .sec-head:first-child { margin-top: 0; }
  .sec-head .ix {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--red);
  }
  .sec-head h2 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 28px;
    line-height: 1.2;
  }
  .sec-head .ct { font-family: var(--mono); font-size: 12px; color: var(--mute); }

  .plate { display: flex; flex-direction: column; gap: 12px; color: inherit; min-width: 0; animation: rise 520ms cubic-bezier(.2,.7,.2,1) both; }
  .plate.lead { grid-column: 1 / -1; }
  .frame { position: relative; aspect-ratio: 16/9; overflow: hidden; background: #000; }
  .frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scale(1.015);
    transition: transform 520ms cubic-bezier(.2,.6,.2,1);
  }
  .plate:hover .frame img { transform: scale(1.05); }
  .plate.lead .frame img { transform: scale(1.07); object-position: 50% 42%; }
  .plate.lead:hover .frame img { transform: scale(1.11); }
  .vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 46%, rgba(12,11,10,0.62) 100%);
    opacity: 0;
    transition: opacity 420ms ease;
    pointer-events: none;
  }
  .plate:hover .vignette { opacity: 1; }
  .float {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    display: flex;
    justify-content: space-between;
    padding: 28px 14px 10px;
    background: linear-gradient(transparent, rgba(12,11,10,0.78));
    color: var(--cream);
    font-size: 12px;
    letter-spacing: 0.04em;
    opacity: 0;
    transform: translateY(6px);
    transition: 360ms cubic-bezier(.2,.7,.2,1);
    pointer-events: none;
  }
  .plate:hover .float { opacity: 1; transform: none; }
  .plate.lead .float { display: none; }
  .burn {
    position: absolute;
    left: 0; right: 0; top: 0;
    padding: 16px 22px 56px;
    background: linear-gradient(180deg, rgba(12,11,10,0.88) 0%, rgba(12,11,10,0.4) 46%, rgba(12,11,10,0) 100%);
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
    pointer-events: none;
  }
  .burn .num { font-family: var(--mono); font-size: 12px; letter-spacing: 0.14em; color: var(--cream); }
  .burn .cn {
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(32px, 3.6vw, 52px);
    line-height: 1.08;
    color: var(--cream);
    text-shadow: 0 1px 2px rgba(12,11,10,0.7);
  }
  .cap {
    display: grid;
    grid-template-columns: 32px minmax(0, 1fr) auto;
    column-gap: 10px;
    row-gap: 3px;
    align-items: baseline;
  }
  .cap .num { font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; color: var(--mute); }
  .plate:hover .cap .num { color: var(--red); }
  .cap .cn { font-family: var(--serif); font-size: 22px; font-weight: 400; line-height: 1.25; }
  .cap .dur { font-family: var(--mono); font-size: 11px; color: var(--mute); }
  .cap .en { grid-column: 2 / 4; font-size: 12px; color: var(--mute); letter-spacing: 0.02em; }
  .cap .line { grid-column: 2 / 4; font-size: 13px; line-height: 1.55; color: var(--cream-2); margin-top: 2px; }
  .plate.lead .cap .cn { font-family: var(--sans); font-size: 13px; color: var(--cream-2); }
  .empty { grid-column: 1 / -1; padding: 48px 0; }
  .now-row .sq { display: block; }
  .empty .cn { font-family: var(--serif); font-size: 28px; font-weight: 400; margin-bottom: 8px; }
  .empty p { color: var(--mute); }

  /* new */
  .screen-new { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(440px, 0.92fr); }
  .hero { position: sticky; top: 0; height: 100vh; overflow: hidden; background: #000; }
  .hero img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 32% 36%;
    transform: scale(1.28);
  }
  .hero::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(90deg, rgba(12,11,10,0.86) 0%, rgba(12,11,10,0.28) 7%, rgba(12,11,10,0.06) 18%, var(--bg) 96%),
      linear-gradient(180deg, rgba(12,11,10,0.7) 0%, rgba(12,11,10,0) 20%, rgba(12,11,10,0) 48%, rgba(12,11,10,0.96) 86%);
    pointer-events: none;
  }
  .hero-back {
    position: absolute;
    z-index: 2;
    top: 22px;
    left: 24px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--cream);
  }
  .hero-back:hover { color: var(--red); }
  .hero-copy {
    position: absolute;
    z-index: 1;
    left: 28px;
    bottom: 36px;
    right: 20%;
  }
  .hero-copy h2, .hero-copy .line { text-shadow: 0 1px 2px rgba(12,11,10,0.45); }
  .hero-copy .num { font-family: var(--mono); font-size: 12px; letter-spacing: 0.14em; color: var(--cream); }
  .hero-copy h2 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(36px, 4vw, 60px);
    line-height: 1.08;
    margin: 8px 0 12px;
  }
  .hero-copy .en { font-size: 13px; letter-spacing: 0.04em; color: var(--cream-2); margin-bottom: 14px; }
  .hero-copy .line { font-size: 15px; line-height: 1.65; max-width: 28em; color: var(--cream); }
  .hero-copy .meta { margin-top: 14px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.04em; color: var(--cream-2); }

  .form-col {
    min-height: 100vh;
    max-height: 100vh;
    overflow: auto;
    display: flex;
    flex-direction: column;
    padding: 28px 40px 28px 24px;
    background: var(--bg);
  }
  .form-kicker { font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; color: var(--mute); margin-bottom: 18px; }
  .field-lab {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--mute);
    margin-bottom: 8px;
  }
  .idea {
    flex: 1;
    min-height: 168px;
    width: 100%;
    background: var(--bg-2);
    border: 1px solid var(--line);
    padding: 16px 16px 18px;
    font-family: var(--serif);
    font-size: 18px;
    line-height: 1.65;
    resize: none;
  }
  .idea:focus { border-color: var(--cream-2); }
  .idea.bad { border-color: var(--red); }
  .idea::placeholder { color: var(--mute); font-family: var(--sans); font-size: 14px; }
  .err { color: var(--red); font-size: 13px; margin-top: 8px; }
  .opt-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    padding: 11px 0;
    border-top: 1px solid var(--line);
    margin-top: 14px;
  }
  .opt-row + .opt-row, .adv + .opt-row, .hint + .opt-row { margin-top: 0; }
  .opt-row .lab { font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; color: var(--mute); }
  .choices { display: flex; gap: 20px; }
  .choices button {
    border-bottom: 2px solid transparent;
    padding: 0 0 3px;
    color: var(--mute);
    font-family: var(--serif);
    font-size: 22px;
    line-height: 1.2;
  }
  .choices button:hover { color: var(--cream-2); }
  .choices button.on { color: var(--cream); border-bottom-color: var(--red); }
  .adv {
    margin-top: 4px;
    color: var(--cream-2);
    font-size: 13px;
    border-bottom: 1px solid var(--line-2);
    padding-bottom: 2px;
    align-self: flex-start;
  }
  .hint { color: var(--mute); font-size: 13px; line-height: 1.6; margin: 10px 0 4px; max-width: 36em; }
  .actions {
    margin-top: auto;
    display: flex;
    align-items: center;
    gap: 28px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
  }
  .btn {
    background: var(--red);
    color: var(--cream);
    font-size: 15px;
    padding: 13px 20px;
    border: 0;
  }
  .btn:hover { background: #c93b28; }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .btn-ghost {
    background: transparent;
    color: var(--cream);
    border: 1px solid var(--line-2);
    padding: 9px 12px;
    font-size: 13px;
  }
  .btn-ghost:hover { border-color: var(--cream-2); }
  .btn-text {
    color: var(--cream-2);
    border-bottom: 1px solid var(--line-2);
    padding-bottom: 2px;
    font-size: 14px;
  }
  .btn-text:hover { color: var(--cream); border-bottom-color: var(--cream); }

  /* desk */
  .desk { height: 100vh; display: grid; grid-template-rows: 56px minmax(0, 1fr); }
  .top {
    position: relative;
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 0 22px;
    border-bottom: 1px solid var(--line);
    min-width: 0;
  }
  .top .back {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--mute);
    flex: none;
  }
  .top .back:hover { color: var(--cream); }
  .title-line { display: flex; align-items: baseline; min-width: 0; flex: 0 1 auto; }
  .title-line .bq { font-family: var(--serif); font-size: 22px; flex: none; }
  .title-line input {
    font-family: var(--serif);
    font-size: 22px;
    width: 8em;
    border-bottom: 1px solid transparent;
    padding: 0 1px 1px;
  }
  .title-line input:focus { border-bottom-color: var(--red); }
  .meta {
    font-size: 12px;
    color: var(--mute);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }
  .status-line {
    margin-left: auto;
    font-size: 11px;
    color: var(--cream-2);
    letter-spacing: 0.02em;
    white-space: nowrap;
  }
  .top .btn-ghost, .top .btn { flex: none; }
  .top .btn { padding: 8px 12px; font-size: 13px; }
  .rbar { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; }
  .rbar i { display: block; height: 100%; width: 0; background: var(--red); }
  .rbar.on i { width: 100%; transition: width 1.25s linear; }

  .body {
    display: grid;
    grid-template-columns: var(--rail) minmax(0, 1fr) var(--dock);
    min-height: 0;
    transition: grid-template-columns 220ms cubic-bezier(.2,.7,.2,1);
  }
  .body.shut { grid-template-columns: var(--rail) minmax(0, 1fr) 36px; }

  .rail {
    border-right: 1px solid var(--line);
    padding: 18px 14px 14px 16px;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .rail-stages { position: relative; display: flex; flex-direction: column; gap: 2px; }
  .rail-stages::before {
    content: "";
    position: absolute;
    left: 3px;
    top: 10px;
    bottom: 10px;
    width: 1px;
    background: var(--line);
  }
  .stage-btn {
    display: grid;
    grid-template-columns: 14px 28px minmax(0, 1fr);
    align-items: center;
    gap: 8px;
    height: 38px;
    color: var(--mute);
    position: relative;
  }
  .stage-btn:hover { color: var(--cream-2); }
  .stage-btn .hole {
    width: 8px;
    height: 11px;
    border: 1px solid rgba(242, 236, 225, 0.38);
    background: var(--bg);
    position: relative;
    z-index: 1;
  }
  .stage-btn.done .hole { background: var(--cream-2); border-color: var(--cream-2); }
  .stage-btn.on { color: var(--cream); }
  .stage-btn.on .name { font-family: var(--serif); font-size: 15px; }
  .stage-btn.on .hole { background: var(--red); border-color: var(--red); }
  .stage-btn .n { font-family: var(--mono); font-size: 11px; }
  .stage-btn .name { font-size: 13px; white-space: nowrap; }
  .rail-foot {
    margin-top: auto;
    border-top: 1px solid var(--line);
    padding-top: 12px;
    display: flex;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--mute);
  }
  .rail-foot strong { font-weight: 400; color: var(--cream); }

  .stage {
    min-width: 0;
    min-height: 0;
    overflow: auto;
    padding: 16px 22px 14px;
  }
  .stage-in { animation: stagein 240ms cubic-bezier(.2,.7,.2,1); }
  .screen-col { width: min(100%, calc((100vh - 348px) * 16 / 9)); }
  .matte {
    background: #000;
    border: 1px solid rgba(242, 236, 225, 0.22);
    padding: 8px;
  }
  .gate {
    position: relative;
    aspect-ratio: 16/9;
    background: #000;
    overflow: hidden;
    width: 100%;
  }
  .gate img { width: 100%; height: 100%; object-fit: cover; transition: filter 600ms ease; }
  .gate img.gray, .still img.gray { filter: grayscale(0.78) brightness(0.96) contrast(0.86) saturate(0.2); }
  .tc {
    position: absolute;
    right: 10px;
    bottom: 10px;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--cream);
    background: rgba(12, 11, 10, 0.55);
    padding: 3px 6px;
  }
  .slate-flag, .still .flag {
    position: absolute;
    left: 10px;
    top: 10px;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    color: var(--cream);
    background: var(--red);
    padding: 3px 6px;
  }
  .slate {
    position: absolute;
    left: 22px;
    bottom: 20px;
    right: 22px;
  }
  .slate strong {
    display: block;
    font-family: var(--serif);
    font-weight: 400;
    font-size: 26px;
    line-height: 1.25;
    margin-bottom: 8px;
  }
  .slate span { font-family: var(--mono); font-size: 12px; color: var(--cream-2); }
  .play {
    position: absolute;
    left: 14px;
    bottom: 14px;
    width: 36px;
    height: 36px;
    border: 1px solid var(--cream);
    background: rgba(12, 11, 10, 0.4);
    display: grid;
    place-items: center;
  }
  .tri {
    width: 0;
    height: 0;
    border-left: 11px solid var(--cream);
    border-top: 7px solid transparent;
    border-bottom: 7px solid transparent;
    margin-left: 3px;

function makeFrames(film, revise) {

  return times.map((t, i) => ({
    t: t,
    crop: CROPS[i],
    status: revise && i === 1 ? "revise" : "ok",
    gray: !!(revise && i === 1),
    note: revise && i === 1 ? "中间灰了一层，纸色不干净。" : (i === 0 ? "开头这张能看懂，留白还在。" : "落幅稳住了。这一张可以留。")

}

function filmStatus(film) {
  if (film.delivered && film.stage === "delivery" && !state.rendering) {
    const cur = film.versions[film.version];
    if (cur && cur.name === "交付") return "已交付 · " + film.lufs + " LUFS";
    if (cur && cur.name === "成片") return "已交付 · " + film.lufs + " LUFS";
  }
  if (film.stage === "frames" && film.frames && film.frames.some(f => f.status === "revise")) return "风格帧 · 第 2 帧待改";
  if (film.stage === "frames" && film.rerolled) return "风格帧 · 已重抽";
  if (film.rendered && film.stage === "delivery") return "成片 · 草稿";
  return stageName(film.stage);
}
function isLive(film) {
  return !(film.delivered && film.stage === "delivery");
}
function dirty(film) {
  return !!(film.frames && film.frames.some(f => f.status === "revise"));
}
function qcItems(film) {
  if (film.delivered && film.versions[film.version] && film.versions[film.version].name !== "草稿") {
    return [["readcheck", "通过 · 6 条字幕"], ["响度", film.lufs + " LUFS"], ["规格", fmtDur(film.dur) + " / 24fps"], ["渲染", "2 分 18 秒"], ["黑帧", "无"], ["字幕", "无遮挡"]];
  }
  const frameNote = !film.frames ? "未抽" : (dirty(film) ? "第 2 帧偏灰" : (film.rerolled ? "第 2 帧已改" : "三张可看"));
  const renderNote = film.rendered ? "草稿 · 响度未测" : "尚未";
  return [["lint", film.frames ? "通过" : "未跑"], ["readcheck", film.delivered || film.rendered ? "待成片复核" : "未跑"], ["风格帧", frameNote], ["规格", fmtDur(film.dur) + " / 24fps"], ["渲染", renderNote], ["黑帧", film.rendered || film.delivered ? "未检" : "未检"]];
}
function qcHTML(film) {

}

function filtered() {
  const q = state.q.trim().toLowerCase();
  return STYLES.filter(s => {
    if (state.cat !== "全部" && s.cat !== state.cat) return false;
    if (!q) return true;
    return [s.cn, s.en, s.slug, s.line, s.cat, s.film, s.num].join("\n").toLowerCase().includes(q);
  });
}
function grouped(list) {
  if (state.q.trim()) return [{ cat: null, items: list }];
  const map = new Map();
  for (const s of list) {
    if (!map.has(s.cat)) map.set(s.cat, []);
    map.get(s.cat).push(s);
  }
  return [...map.entries()].map(([cat, items]) => ({ cat, items }));
}

function plateHTML(s, lead, i) {

function paintWall() {

function reroll() {

  if (film.delivered && film.versions[film.version] && film.versions[film.version].name === "交付") {

    return;

  if (film.rerolled && !dirty(film)) {
    say("导演", "刚抽过。和第 2 帧改过的一样，没有新问题。要动的话改 film.js，不是再抽一遍。");

  state.pulling = true;
  pullToken += 1;
  const token = pullToken;

function fixFrame() {

  if (f.status === "revise") {
    const already = film.messages.some(m => m.text.includes("罩染"));

function nextVer(film) {

    state.rendering = false;

function quick(q) {

function sendSay() {

function startPlay(keep) {
  const film = state.film;
  if (!keep) film.playing = !film.playing;
  if (!film.playing) { stopPlay(); paintStage(); return; }
  if (state.playTimer) clearInterval(state.playTimer);
  state.playTimer = setInterval(() => {
    if (!state.film || state.film.stage !== "delivery") { stopPlay(); return; }
    state.film.playhead += 0.2;
    if (state.film.playhead >= state.film.dur) state.film.playhead = 0;
    const tc = document.getElementById("play-tc");
    const read = document.getElementById("play-read");
    const bar = document.getElementById("play-bar");
    if (tc) tc.textContent = fmtTC(state.film.playhead);
    if (read) read.textContent = fmtTC(state.film.playhead) + " / " + fmtTC(state.film.dur);
    if (bar) bar.style.width = (state.film.playhead / state.film.dur * 100) + "%";
  }, 80);
  if (!keep) paintStage();
}
function seek(e) {
  const film = state.film;
  const bar = e.target.closest(".scrub");
  if (!bar || !film) return;
  const r = bar.getBoundingClientRect();
  film.playhead = Math.min(film.dur, Math.max(0, (e.clientX - r.left) / r.width * film.dur));
  const tc = document.getElementById("play-tc");
  const read = document.getElementById("play-read");
  const fill = document.getElementById("play-bar");
  if (tc) tc.textContent = fmtTC(film.playhead);
  if (read) read.textContent = fmtTC(film.playhead) + " / " + fmtTC(film.dur);
  if (fill) fill.style.width = (film.playhead / film.dur * 100) + "%";
}

function onClick(e) {
  if (e.target.id === "light") { closeLight(); return; }
  const t = e.target.closest("[data-act]");
  if (!t) return;
  const act = t.dataset.act;
  if (act === "cat") {
    state.cat = t.dataset.cat;
    paintIndex();
    paintWall();
    return;
  }
  if (act === "clear-q") {
    state.q = "";
    const q = document.getElementById("q");
    if (q) q.value = "";
    paintWall();
    if (q) q.focus();
    return;
  }
  if (act === "open-style") { openStyle(t.dataset.slug); return; }
  if (act === "open-film") { openFilm(t.dataset.id); return; }
  if (act === "back") {
    saveDraft();
    state.screen = "gallery";
    state.status = "";
    draw();
    return;
  }
  if (act === "create") { createFilm(); return; }
  if (act === "choice") {
    const name = t.dataset.name;
    let v = t.dataset.v;
    if (v === "true") v = true;
    else if (v === "false") v = false;
    else if (name === "dur") v = Number(v);
    state[name] = v;
    saveDraft();
    drawNew();
    return;
  }
  if (act === "adv") { state.advOpen = !state.advOpen; saveDraft(); drawNew(); return; }
  if (act === "stage") { gotoStage(t.dataset.stage); return; }
  if (act === "dock") {
    state.dockOpen = !state.dockOpen;
    document.getElementById("body").classList.toggle("shut", !state.dockOpen);
    document.getElementById("dock").classList.toggle("shut", !state.dockOpen);
    return;
  }
  if (act === "finder") {
    state.status = "Finder · " + projectPath(state.film);
    paintStatus();
    return;
  }
  if (act === "render") { startRender(); return; }
  if (act === "reroll") { reroll(); return; }
  if (act === "extract") { extract(); return; }
  if (act === "fix-frame") { fixFrame(); return; }
  if (act === "select-frame") {
    state.film.frame = Number(t.dataset.i);
    paintStage();
    return;
  }
  if (act === "open-frame") { openLight(); return; }
  if (act === "close-light") { closeLight(); return; }
  if (act === "play") { startPlay(false); return; }
  if (act === "seek") { seek(e); return; }
  if (act === "version") {
    state.film.version = Number(t.dataset.i);
    state.film.playhead = 0;
    stopPlay();
    paintStage();
    return;
  }
  if (act === "open-file") {
    const film = state.film;
    const cur = film.versions[film.version];
    if (!cur) {
      state.status = "还没有成片文件";
      say("导演", "文件夹里还没有成片。先渲染草稿。");
    } else {
      state.status = "Finder · " + projectPath(film) + "/deliver/" + cur.ver + ".mp4";
    }
    paintStatus();
    return;
  }
  if (act === "pick") {
    state.film.treatment.chosen = t.dataset.v;
    state.film.treatment.why = t.dataset.v === "B" ? "开头三秒有东西可看。不从全景慢慢推。" : "改选 " + t.dataset.v + "。镜头表按这个重排，风格不动。";
    paintStage();
    say("导演", t.dataset.v === "B" ? "就 B。开头三秒有东西可看，不全景慢慢推。" : "改选 " + t.dataset.v + "。镜头表我按这个重排，风格不动。");
    return;
  }
  if (act === "make-sheet") { makeSheet(); return; }
  if (act === "quick") { quick(t.dataset.q); return; }
  if (act === "send") { sendSay(); return; }
}
function onInput(e) {
  if (e.target.id === "q") {
    state.q = e.target.value;
    paintWall();
  } else if (e.target.id === "idea") {
    state.idea = e.target.value;
    state.ideaError = false;
    e.target.classList.remove("bad");
    const err = document.getElementById("idea-err");
    if (err) err.hidden = true;
    saveDraft();
  } else if (e.target.id === "title") {
    const v = e.target.value.replace(/[《》]/g, "").trim();
    if (v) state.film.title = v;
    const ctx = document.getElementById("ctx-title");
    if (ctx && v) ctx.textContent = book(v);
    sizeTitle(e.target);
  }
}
function onKey(e) {
  if (e.key === "Escape") { closeLight(); return; }
  if (e.key === "Enter" && e.target.id === "say") { e.preventDefault(); sendSay(); }
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey) && e.target.id === "idea") { e.preventDefault(); createFilm(); }
}

document.addEventListener("click", onClick);
document.addEventListener("input", onInput);
document.addEventListener("keydown", onKey);

// shortcut: 风格帧和成片预览用海报裁切代替 still.mjs / video.mjs 的真输出，接渲染管线时换掉。
function boot() {
  if (!Array.isArray(STYLES) || STYLES.length !== 66) {
    document.getElementById("app").innerHTML = '<p style="padding:24px;color:#f2ece1">风格数据没有装上。</p>';
    return;
  }
  seed();
  const hash = location.hash.slice(1);
  if (hash.startsWith("desk/")) openFilm(hash.slice(5));
  else if (hash.startsWith("new/")) openStyle(hash.slice(4));
  else draw();
}
boot();
</script>
</body>
</html>
